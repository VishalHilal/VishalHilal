<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
<title id="t">Vishal Hilal – Full-Stack Web Developer</title>
<desc id="d">Aurora banner with drifting glows, orbiting dots and a terminal line typing the stack.</desc>
<style>
.rise{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.b1{animation:drift1 14s ease-in-out infinite alternate}.b2{animation:drift2 18s ease-in-out infinite alternate}.b3{animation:drift1 22s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(120px,40px)}}@keyframes drift2{to{transform:translate(-140px,-30px)}}
.o1{transform-box:view-box;transform-origin:1030px 210px;animation:spin 14s linear infinite}
.o2{transform-box:view-box;transform-origin:1030px 210px;animation:spin 22s linear infinite reverse}
.o3{transform-box:view-box;transform-origin:1030px 210px;animation:spin 34s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.l0{animation:show0 12s linear infinite}.t0{animation:type0 12s infinite}@keyframes show0{0%,0%{opacity:0}0.0%,30.0%{opacity:1}33.33%,100%{opacity:0}}@keyframes type0{0%,0.0%{transform:translateX(0);animation-timing-function:steps(28,end)}13.33%,100%{transform:translateX(370.8px)}}.l1{animation:show1 12s linear infinite}.t1{animation:type1 12s infinite}@keyframes show1{0%,33.32%{opacity:0}33.33%,63.33%{opacity:1}66.67%,100%{opacity:0}}@keyframes type1{0%,33.33%{transform:translateX(0);animation-timing-function:steps(25,end)}46.67%,100%{transform:translateX(331.1px)}}.l2{animation:show2 12s linear infinite}.t2{animation:type2 12s infinite}@keyframes show2{0%,66.66%{opacity:0}66.67%,96.67%{opacity:1}100.0%,100%{opacity:0}}@keyframes type2{0%,66.67%{transform:translateX(0);animation-timing-function:steps(23,end)}80.0%,100%{transform:translateX(304.6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.l0{opacity:1}.t0{transform:translateX(371px)}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0B22"/><stop offset="1" stop-color="#1B1145"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B5FD"/><stop offset=".55" stop-color="#7DD3FC"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="420" fill="url(#bg)"/>
<g filter="url(#blur)"><circle class="b1" cx="220" cy="80" r="150" fill="#7C3AED" opacity=".55"/><circle class="b2" cx="900" cy="330" r="170" fill="#06B6D4" opacity=".4"/><circle class="b3" cx="1100" cy="60" r="130" fill="#EC4899" opacity=".3"/></g>
<g class="rise"><text x="88" y="166" font-family="ui-rounded,'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="88" font-weight="800" letter-spacing="-2.5" fill="url(#ttl)">Vishal Hilal</text></g>
<g class="rise d1"><text x="92" y="222" font-family="ui-rounded,'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="30" font-weight="500" fill="#C7D2FE">Full-Stack Web Developer · AI-assisted builder</text></g>
<g class="rise d2">
<rect x="92" y="296" width="500" height="68" rx="16" fill="#0B0B22" stroke="#8B5CF6" stroke-opacity=".4"/>
<text x="116" y="338" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#22D3EE">›</text>
<g class="l0" opacity="0"><text x="150" y="338" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="22" fill="#E8ECFF">React · Next.js · TypeScript</text><g class="t0"><rect x="150" y="314" width="374.8" height="34" fill="#0B0B22"/><rect class="caret" x="150" y="316" width="11" height="30" rx="2" fill="#5EEAD4"/></g></g><g class="l1" opacity="0"><text x="150" y="338" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="22" fill="#E8ECFF">Node.js · MongoDB · MySQL</text><g class="t1"><rect x="150" y="314" width="335.1" height="34" fill="#0B0B22"/><rect class="caret" x="150" y="316" width="11" height="30" rx="2" fill="#5EEAD4"/></g></g><g class="l2" opacity="0"><text x="150" y="338" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="22" fill="#E8ECFF">Claude Code · MCP · RAG</text><g class="t2"><rect x="150" y="314" width="308.6" height="34" fill="#0B0B22"/><rect class="caret" x="150" y="316" width="11" height="30" rx="2" fill="#5EEAD4"/></g></g>
</g>
<!-- orbit monogram -->
<g fill="none" stroke="url(#ring)" stroke-opacity=".35" stroke-width="1.5"><circle cx="1030" cy="210" r="92"/><circle cx="1030" cy="210" r="140" stroke-dasharray="4 8"/><circle cx="1030" cy="210" r="188" stroke-opacity=".18"/></g>
<g class="o1"><circle cx="1122" cy="210" r="8" fill="#22D3EE"/></g>
<g class="o2"><circle cx="1030" cy="70" r="7" fill="#C084FC"/></g>
<g class="o3"><circle cx="1218" cy="210" r="6" fill="#F472B6"/></g>
<g class="pulse"><circle cx="1030" cy="210" r="58" fill="#0B0B22" stroke="url(#ring)" stroke-width="3"/>
<text x="1030" y="226" text-anchor="middle" font-family="ui-rounded,'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="44" font-weight="800" fill="url(#ttl)">VH</text></g>
</g>
<rect x=".5" y=".5" width="1279" height="419" rx="27.5" fill="none" stroke="#8B5CF6" stroke-opacity=".3"/>
</svg>