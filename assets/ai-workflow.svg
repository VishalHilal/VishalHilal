<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
<title id="t">AI-assisted development workflow</title>
<desc id="d">A packet travels through Prompt, Claude Code, MCP tools, LLM APIs, RAG and App, pulsing each stage.</desc>

<style>
.flow{animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-22}}
.pkt{animation:go 8s cubic-bezier(.45,.05,.4,1) infinite}
@keyframes go{0%{transform:translateX(0);opacity:0}3%{opacity:1}62%{transform:translateX(1000px);opacity:1}66%,100%{transform:translateX(1000px);opacity:0}}
.halo{transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes hit{0%{transform:scale(1);opacity:.9}30%,100%{transform:scale(1.7);opacity:0}}
.n0{animation:hit 8s ease-out 0.0s infinite}.n1{animation:hit 8s ease-out 1.0s infinite}.n2{animation:hit 8s ease-out 2.0s infinite}.n3{animation:hit 8s ease-out 3.0s infinite}.n4{animation:hit 8s ease-out 4.0s infinite}.n5{animation:hit 8s ease-out 5.0s infinite}
.scan{animation:scan 6s linear infinite}@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(360px)}}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{transform:translateX(500px);opacity:1}}
</style>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#04100B"/>
<stop offset="1" stop-color="#0A1F17"/>
</linearGradient>

<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" fill="none" stroke="#34D399" stroke-opacity=".06"/>
</pattern>

<linearGradient id="sc" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#34D399" stop-opacity="0"/>
<stop offset="1" stop-color="#34D399" stop-opacity=".12"/>
</linearGradient>

<clipPath id="card">
<rect width="1280" height="320" rx="24"/>
</clipPath>
</defs>

<g clip-path="url(#card)">
<rect width="1280" height="320" fill="url(#bg)"/>
<rect width="1280" height="320" fill="url(#grid)"/>
<rect class="scan" width="1280" height="40" fill="url(#sc)"/>

<g class="rise">
<text x="48" y="58" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#34D399">$ ai-assisted-development</text>
<text x="48" y="86" font-family="ui-rounded,'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" fill="#6EE7B7" fill-opacity=".7">agentic workflows · MCP · tool use · RAG · context engineering</text>
</g>

<line x1="140" y1="170" x2="1140" y2="170" stroke="#34D399" stroke-opacity=".3" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 11" class="flow"/>

<!-- Prompt -->
<g transform="translate(140 170)">
<circle class="halo n0" r="44" fill="none" stroke="#34D399" stroke-width="2"/>
<circle r="44" fill="#06150F" stroke="#34D399" stroke-opacity=".55" stroke-width="2"/>
<text y="8" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#A7F3D0">›_</text>
<text y="84" text-anchor="middle" font-family="ui-rounded,'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#D1FAE5">Prompt</text>
</g>

<!-- Claude Code -->
<g transform="translate(340 170)">
<circle class="halo n1" r="44" fill="none" stroke="#34D399" stroke-width="2"/>
<circle r="44" fill="#06150F" stroke="#34D399" stroke-opacity=".55" stroke-width="2"/>
<text y="8" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#A7F3D0">CC</text>
<text y="84" text-anchor="middle" font-family="ui-rounded,'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#D1FAE5">Claude Code</text>
</g>

<!-- MCP Tools -->
<g transform="translate(540 170)">
<circle class="halo n2" r="44" fill="none" stroke="#34D399" stroke-width="2"/>
<circle r="44" fill="#06150F" stroke="#34D399" stroke-opacity=".55" stroke-width="2"/>
<text y="8" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#A7F3D0">MCP</text>
<text y="84" text-anchor="middle" font-family="ui-rounded,'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#D1FAE5">MCP tools</text>
</g>

<!-- LLM APIs -->
<g transform="translate(740 170)">
<circle class="halo n3" r="44" fill="none" stroke="#34D399" stroke-width="2"/>
<circle r="44" fill="#06150F" stroke="#34D399" stroke-opacity=".55" stroke-width="2"/>
<text y="8" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#A7F3D0">fn()</text>
<text y="84" text-anchor="middle" font-family="ui-rounded,'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#D1FAE5">LLM APIs</text>
</g>

<!-- RAG -->
<g transform="translate(940 170)">
<circle class="halo n4" r="44" fill="none" stroke="#34D399" stroke-width="2"/>
<circle r="44" fill="#06150F" stroke="#34D399" stroke-opacity=".55" stroke-width="2"/>
<text y="8" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#A7F3D0">RAG</text>
<text y="84" text-anchor="middle" font-family="ui-rounded,'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#D1FAE5">RAG</text>
</g>

<!-- App -->
<g transform="translate(1140 170)">
<circle class="halo n5" r="44" fill="none" stroke="#34D399" stroke-width="2"/>
<circle r="44" fill="#06150F" stroke="#34D399" stroke-opacity=".55" stroke-width="2"/>
<text y="8" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#A7F3D0">&lt;/&gt;</text>
<text y="84" text-anchor="middle" font-family="ui-rounded,'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#D1FAE5">App</text>
</g>

<!-- Animated packet -->
<g transform="translate(140 170)">
<g class="pkt">
<circle r="16" fill="#34D399" opacity=".25"/>
<circle r="7" fill="#ECFDF5"/>
</g>
</g>

</g>

<rect x=".5" y=".5" width="1279" height="319" rx="23.5" fill="none" stroke="#34D399" stroke-opacity=".25"/>
</svg>
